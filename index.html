<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="エンジニア職を中心に、公開可能な求人情報をまとめた静的ジョブボードです。">
    <meta name="theme-color" content="#122a24">
    <title>しごと展望台 | エンジニア求人一覧</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero__glow" aria-hidden="true"></div>
      <div class="shell hero__inner">
        <a class="brand" href="./" aria-label="しごと展望台 ホーム">
          <span class="brand__mark" aria-hidden="true">展</span>
          <span>しごと展望台</span>
        </a>
        <div class="hero__copy">
          <p class="eyebrow">ENGINEERING OPPORTUNITIES</p>
          <h1>次の仕事を、<br><span>見晴らしよく。</span></h1>
          <p class="hero__lead">エンジニア職を中心に、公開情報から厳選した求人を一覧で探せます。</p>
        </div>
        <div class="hero__meta" aria-label="掲載情報">
          <div>
            <span class="hero__meta-label">掲載中</span>
            <strong id="total-count">—</strong><span> 件</span>
          </div>
          <div>
            <span class="hero__meta-label">最終更新</span>
            <strong id="updated-at">読み込み中</strong>
          </div>
        </div>
      </div>
    </header>

    <main class="shell main-content">
      <section class="search-panel" aria-labelledby="search-title">
        <div class="search-panel__heading">
          <div>
            <p class="section-kicker">FIND YOUR ROLE</p>
            <h2 id="search-title">求人を探す</h2>
          </div>
          <button id="clear-filters" class="text-button" type="button" hidden>条件をクリア</button>
        </div>

        <div class="controls">
          <label class="field field--search" for="search-input">
            <span class="field__label">キーワード</span>
            <span class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input id="search-input" type="search" placeholder="職種・会社・勤務地・スキル" autocomplete="off">
            </span>
          </label>
          <label class="field" for="source-filter">
            <span class="field__label">掲載元</span>
            <span class="select-wrap">
              <select id="source-filter">
                <option value="all">すべての掲載元</option>
              </select>
            </span>
          </label>
        </div>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="results__header">
          <h2 id="results-title">新着求人</h2>
          <p id="result-count" class="results__count" aria-live="polite">読み込み中です</p>
        </div>
        <div id="status" class="status" role="status">
          <span class="loader" aria-hidden="true"></span>
          求人情報を読み込んでいます
        </div>
        <div id="job-list" class="job-list" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <div class="shell footer__inner">
        <p><strong>しごと展望台</strong><br>公開情報のみを掲載する静的ジョブボード</p>
        <p>掲載内容は受信時点の情報です。最新の募集状況は各掲載元でご確認ください。</p>
      </div>
    </footer>

    <template id="job-card-template">
      <article class="job-card">
        <div class="job-card__topline">
          <span class="source-badge"></span>
          <time class="job-date"></time>
        </div>
        <div class="job-card__body">
          <p class="job-company"></p>
          <h3 class="job-title"></h3>
          <p class="job-summary"></p>
          <dl class="job-facts"></dl>
          <ul class="tag-list" aria-label="求人タグ"></ul>
        </div>
        <div class="job-card__action"></div>
      </article>
    </template>

    <noscript>
      <div class="noscript">求人一覧の表示にはJavaScriptを有効にしてください。</div>
    </noscript>
  </body>
</html>
